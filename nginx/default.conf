server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drop.jemaos.com;

    access_log /etc/nginx/logs/jemadrop.access.log;
    error_log /etc/nginx/logs/jemadrop.error.log;

    ssl_certificate /etc/nginx/certs/drop.jemaos.com.cer;
    ssl_certificate_key /etc/nginx/certs/drop.jemaos.com.key;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /server {
        proxy_pass http://node:6000;
        # WebSocket exige HTTP/1.1 : sans cette ligne nginx parle HTTP/1.0
        # au serveur node et l upgrade echoue (appareils invisibles).
        proxy_http_version 1.1;
        proxy_connect_timeout 300;
        # Connexions WebSocket longue duree : le defaut nginx (60s) tuait
        # les connexions inactives -> appareils qui disparaissent.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_set_header Host $host;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        # Rooms isolees par IP publique du client (pas celle du proxy).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/jpeg image/png;
}

# HTTP redirect
server {
    listen 80;
    listen [::]:80;
    server_name drop.jemaos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/webroot;
        default_type "text/plain";
    }

    location / {
        return 301 https://drop.jemaos.com$request_uri;
    }
}
